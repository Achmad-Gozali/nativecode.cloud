name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/nativecode
            git pull origin main
            docker build -t nativecode-app:latest .
            docker stop nativecode-app || true
            docker rm nativecode-app || true
            docker run -d \
              --name nativecode-app \
              --network nativecode-net \
              -p 127.0.0.1:3001:3000 \
              --env-file /opt/nativecode/.env.production \
              --restart unless-stopped \
              nativecode-app:latest
            docker ps --filter name=nativecode-app
            docker image prune -f